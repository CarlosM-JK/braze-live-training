name: Actualizar sesiones de Braze

on:
  schedule:
    # Todos los días a las 05:17 UTC (06:17 en Madrid en invierno, 07:17 en verano)
    - cron: "17 5 * * *"
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

concurrency:
  group: update-sessions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar sesiones
        run: python scripts/fetch_sessions.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/sessions.json; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sessions.json
          git commit -m "Actualizar sesiones de Braze Learning"
          git push
