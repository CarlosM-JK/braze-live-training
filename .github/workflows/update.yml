name: Actualizar y publicar la web

on:
  schedule:
    # Todos los días a las 05:17 UTC (06:17 en Madrid en invierno, 07:17 en verano)
    - cron: "17 5 * * *"
  push:
    branches: [main]      # al subir cambios (diseño, páginas nuevas) se publica solo
  workflow_dispatch: {}   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que existe la contraseña
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          if [ -z "$STATICRYPT_PASSWORD" ]; then
            echo "Falta el secreto STATICRYPT_PASSWORD (Settings > Secrets and variables > Actions)." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar sesiones de Braze
        id: fetch
        continue-on-error: true   # si falla, se publica igualmente con los últimos datos buenos
        run: python scripts/fetch_sessions.py

      - name: Descargar releases de Braze
        id: releases
        continue-on-error: true   # si falla, se publica con las últimas releases buenas
        run: python scripts/fetch_releases.py

      - name: Buscar imágenes oficiales de la actualidad
        continue-on-error: true   # si no encuentra imagen, la web pone una ilustración de marca
        run: python scripts/fetch_images.py

      - name: Guardar datos nuevos en el repositorio
        if: github.event_name != 'push'
        run: |
          git add -N data/releases.json 2>/dev/null || true
          if git diff --quiet -- data/sessions.json data/releases.json data/actualidad.json; then
            echo "Sin cambios en sesiones, releases ni actualidad."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sessions.json data/releases.json data/actualidad.json
          git commit -m "Actualizar sesiones, releases e imágenes de actualidad"
          git push

      - name: Montar la web
        run: python scripts/build_site.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cifrar las páginas con contraseña
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        working-directory: _site
        run: |
          # StatiCrypt deja el resultado en _enc/_site (cifra el HTML y copia los logos)
          npx --yes staticrypt@3.5.4 . -r -d ../_enc \
            --config false \
            --salt 6a3f1c9e2b7d4a0f8e5c1b9d7a3e6f20 \
            --short \
            --remember 30 \
            --template ../scripts/staticrypt_template.html \
            --template-title "COE Braze Iberia" \
            --template-instructions "Introduce la contraseña del grupo · Enter the group password" \
            --template-placeholder "Contraseña / Password" \
            --template-button "Entrar / Enter" \
            --template-remember "Recordarme 30 días / Remember me" \
            --template-error "Contraseña incorrecta / Wrong password"
          test -f ../_enc/_site/index.html && test -f ../_enc/_site/sesiones/index.html && test -f ../_enc/_site/releases/index.html && test -f ../_enc/_site/actualidad/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _enc/_site

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Avisar si falló alguna descarga de Braze
        if: steps.fetch.outcome == 'failure' || steps.releases.outcome == 'failure'
        run: |
          echo "La web se ha publicado, pero falló la descarga de sesiones o de releases de Braze. Revisa los pasos 'Descargar ...' de esta ejecución." >&2
          exit 1
