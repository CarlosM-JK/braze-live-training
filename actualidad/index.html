<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Actualidad Braze · COE Braze Iberia</title>
<link rel="icon" type="image/png" href="../assets/jakala-j-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Actualidad Braze (diseño X2 · Feed con seguimiento): noticias seleccionadas cada semana
   + panel fijo de seguimiento Braze + Salesforce. Datos de data/actualidad.json. */
:root{
  --jblue:#040066; --jblue-2:#040ab2; --jblue-3:#1941fa; --jblue-4:#3c82ff; --sky:#8caaff; --rail:#c3cdf2;
  --ink:#0d0b33; --black:#000; --red:#f00a0a; --muted:#4a4a63; --muted-2:#6b6b80;
  --line:#e3e6ef; --tint:#eef1fb; --soft:#f6f7fb; --white:#fff;
  --font:"Raleway",-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--jblue-3);text-decoration:none}
a:hover{color:var(--jblue)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 48px}
.mesh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
:focus-visible{outline:2px solid var(--jblue-3);outline-offset:3px}

.top{background:var(--white);border-bottom:1px solid #e8e8ee}
.top .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;color:inherit}
.brand img{height:22px;display:block}
.brand i{width:1px;height:22px;background:#cfcfcf}
.brand span{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--black)}
.nav{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:700;flex-wrap:wrap}
.nav a{color:var(--black)}
.nav a[aria-current="page"]{color:var(--jblue-3)}
.langs{display:flex;gap:4px;padding-left:22px;border-left:1px solid #e3e3e8}
.langs button{background:none;border:0;font:700 12px var(--font);letter-spacing:.08em;color:#8a8a99;padding:6px;cursor:pointer;border-bottom:2px solid transparent}
.langs button[aria-pressed="true"]{color:var(--black);border-bottom-color:var(--red)}

.head{position:relative;overflow:hidden;background:var(--tint)}
.head .wrap{position:relative;padding-top:56px;padding-bottom:48px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px}
.num{font-size:110px;line-height:.8;font-weight:900;color:transparent;-webkit-text-stroke:2px var(--jblue-3)}
.head h1{font-size:clamp(40px,5vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.02em;color:var(--jblue);margin-top:18px}
.head p{margin:12px 0 0;font-size:17px;color:var(--muted);max-width:56ch}
.stats{display:flex;gap:36px;flex-wrap:wrap}
.stat b{display:block;font-size:40px;font-weight:900;line-height:1;color:var(--jblue)}
.stat span{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted-2)}

.body{padding-top:40px;padding-bottom:96px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.feedw{flex:999 1 640px;min-width:0;position:relative;padding-left:42px}
.feedw::before{content:"";position:absolute;left:10px;top:76px;bottom:20px;width:2px;background:var(--rail)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{padding:7px 14px;border:1px solid #cfd4e2;background:var(--white);color:var(--ink);font:700 13px var(--font);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--jblue);border-color:var(--jblue);color:var(--white)}
.filters button span{opacity:.6;margin-left:4px}
.feed{display:flex;flex-direction:column;gap:14px}
.news{position:relative;display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);background:var(--white)}
.news .node{position:absolute;left:-41px;top:26px;width:20px;height:23px;background:var(--rail)}
.news:first-child .node{background:var(--jblue-3)}
.news .pic{position:relative;overflow:hidden;min-height:170px;background:var(--jblue) center/cover no-repeat;display:grid;place-items:center}
.news .pic span{position:relative;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#c9d3ff;padding:0 12px;text-align:center}
.news .txt{padding:20px 24px;display:flex;flex-direction:column;gap:8px}
.news .meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted-2)}
.news .cat{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--jblue-3)}
.news h2{font-size:19px;line-height:1.3;font-weight:800}
.news p{margin:0;font-size:14px;line-height:1.55;color:var(--muted)}
.news p b{color:var(--jblue)}
.news .go{font-size:13px;font-weight:800}
.pill{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;white-space:nowrap}
.pill.anunciado{background:var(--jblue);color:var(--white)}
.pill.rumoreado{background:var(--white);color:var(--jblue);box-shadow:inset 0 0 0 1px var(--jblue)}
.pill.disponible{background:var(--jblue-3);color:var(--white)}
.pill.analisis{background:var(--tint);color:var(--jblue)}
.side{flex:1 1 340px;max-width:400px;position:sticky;top:24px;background:var(--soft);padding:28px;display:flex;flex-direction:column;gap:22px}
.side .over{margin:0;font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--jblue-3)}
.side h2{margin-top:6px;font-size:26px;font-weight:800;color:var(--jblue)}
.side .phase{margin:8px 0 0;font-size:14px;font-weight:700;color:var(--muted)}
.miles{display:flex;flex-direction:column}
.mile{position:relative;padding:0 0 16px 28px}
.mile::before{content:"";position:absolute;left:6px;top:20px;bottom:0;width:2px;background:#d9dce8}
.mile:last-child::before{display:none}
.mile i{position:absolute;left:0;top:4px;width:14px;height:16px;background:#d9dce8}
.mile.done i{background:var(--jblue)}.mile.next i{background:var(--jblue-3)}
.mile b{display:block;font-size:14px;color:var(--ink)}
.mile.todo b{color:var(--muted-2)}
.mile span{display:block;margin-top:2px;font-size:12px;color:var(--muted-2)}
.sfi{padding:14px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sfi .meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted-2)}
.sfi a{font-size:14px;font-weight:800;line-height:1.35;color:var(--ink)}
.sfi a:hover{color:var(--jblue-3)}
.sfi p{margin:0;font-size:13px;color:var(--muted)}
.empty{padding:40px;border:1px dashed #c9cdd8;color:var(--muted-2);text-align:center}

footer{background:#000;border-top:4px solid var(--red);color:#b5b5c0;font-size:13px}
footer .wrap{padding-top:32px;padding-bottom:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer img{height:18px;display:block}

@media (max-width:900px){.side{position:static;max-width:none}}
@media (max-width:640px){.wrap{padding:0 20px}.nav{gap:14px;font-size:13px}.langs{padding-left:10px}.num{font-size:80px}.feedw{padding-left:30px}.feedw::before{left:6px}.news{grid-template-columns:1fr}.news .node{left:-31px}.news .pic{min-height:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../"><img src="../assets/jakala-logo-full.png" alt="JAKALA"><i></i><span>COE Braze Iberia</span></a>
    <nav class="nav" aria-label="Secciones">
      <a href="../sesiones/" data-t="nav1"></a>
      <a href="../releases/" data-t="nav2"></a>
      <a href="./" aria-current="page" data-t="nav3"></a>
      <span class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="it">IT</button>
      </span>
    </nav>
  </div>
</header>

<section class="head">
  <svg class="mesh" aria-hidden="true" style="opacity:.7"><defs><pattern id="hx" width="48" height="83" patternUnits="userSpaceOnUse"><path d="M24 0L48 13.9V41.6L24 55.4L0 41.6V13.9Z M24 55.4V83" fill="none" stroke="#dbe2f8" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#hx)"/></svg>
  <div class="wrap">
    <div>
      <span class="num" aria-hidden="true">03</span>
      <h1 data-t="title"></h1>
      <p data-t="lead"></p>
    </div>
  </div>
</section>

<div class="wrap body">
  <div class="feedw">
    <div class="filters" id="filters" role="group" data-t-aria="filtersLabel"></div>
    <div class="feed" id="feed"></div>
  </div>
  <aside class="side" id="side"></aside>
</div>

<footer>
  <div class="wrap">
    <img src="../assets/jakala-logo-white.png" alt="JAKALA">
    <span id="src"></span>
  </div>
</footer>

<script>
let DATA = /*__ACTUALIDAD__*/null;

const I18N = {
 es:{ locale:"es-ES", nav1:"01 Formación", nav2:"02 Producto", nav3:"03 Actualidad", filtersLabel:"Filtrar por categoría",
  title:"Actualidad Braze", lead:"Lo más relevante alrededor de Braze, seleccionado y explicado cada semana por el COE. A la derecha, el seguimiento de la compra por Salesforce.",
  all:"Todas", why:"Por qué nos importa", read:s=>`Leer en ${s} ↗`, track:"SEGUIMIENTO", sfTitle:"Braze + Salesforce",
  cats:{producto:"Producto",mercado:"Mercado",eventos:"Eventos",corporativo:"Corporativo",salesforce:"Braze + Salesforce"},
  st:{anunciado:"Anunciado",rumoreado:"Rumoreado",disponible:"Disponible",analisis:"Análisis"},
  noData:"Todavía no hay noticias. Llegarán con la próxima selección semanal.",
  src:d=>`Selección semanal del COE · Actualizado el ${d}` },
 en:{ locale:"en-GB", nav1:"01 Training", nav2:"02 Product", nav3:"03 News", filtersLabel:"Filter by category",
  title:"Braze news", lead:"The most relevant news around Braze, selected and explained every week by the COE. On the right, tracking of the Salesforce acquisition.",
  all:"All", why:"Why it matters", read:s=>`Read on ${s} ↗`, track:"TRACKING", sfTitle:"Braze + Salesforce",
  cats:{producto:"Product",mercado:"Market",eventos:"Events",corporativo:"Corporate",salesforce:"Braze + Salesforce"},
  st:{anunciado:"Announced",rumoreado:"Rumoured",disponible:"Available",analisis:"Analysis"},
  noData:"No news yet. It will arrive with the next weekly selection.",
  src:d=>`Weekly COE selection · Updated on ${d}` },
 fr:{ locale:"fr-FR", nav1:"01 Formation", nav2:"02 Produit", nav3:"03 Actualités", filtersLabel:"Filtrer par catégorie",
  title:"Actualités Braze", lead:"L'essentiel de l'actualité autour de Braze, sélectionné et expliqué chaque semaine par le COE. À droite, le suivi du rachat par Salesforce.",
  all:"Toutes", why:"Pourquoi c'est important", read:s=>`Lire sur ${s} ↗`, track:"SUIVI", sfTitle:"Braze + Salesforce",
  cats:{producto:"Produit",mercado:"Marché",eventos:"Événements",corporativo:"Entreprise",salesforce:"Braze + Salesforce"},
  st:{anunciado:"Annoncé",rumoreado:"Rumeur",disponible:"Disponible",analisis:"Analyse"},
  noData:"Pas encore d'actualités. Elles arriveront avec la prochaine sélection hebdomadaire.",
  src:d=>`Sélection hebdomadaire du COE · Mis à jour le ${d}` },
 it:{ locale:"it-IT", nav1:"01 Formazione", nav2:"02 Prodotto", nav3:"03 Attualità", filtersLabel:"Filtra per categoria",
  title:"Attualità Braze", lead:"Le notizie più rilevanti su Braze, selezionate e spiegate ogni settimana dal COE. A destra, il monitoraggio dell'acquisizione da parte di Salesforce.",
  all:"Tutte", why:"Perché ci interessa", read:s=>`Leggi su ${s} ↗`, track:"MONITORAGGIO", sfTitle:"Braze + Salesforce",
  cats:{producto:"Prodotto",mercado:"Mercato",eventos:"Eventi",corporativo:"Azienda",salesforce:"Braze + Salesforce"},
  st:{anunciado:"Annunciato",rumoreado:"Indiscrezione",disponible:"Disponibile",analisis:"Analisi"},
  noData:"Ancora nessuna notizia. Arriverà con la prossima selezione settimanale.",
  src:d=>`Selezione settimanale del COE · Aggiornato il ${d}` }
};
let LANG="es";
try { const s=localStorage.getItem("blt-lang"); if(I18N[s]) LANG=s; else { const n=(navigator.language||"").slice(0,2); if(I18N[n]) LANG=n; } } catch(e) {}
const T=()=>I18N[LANG];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tr=o=>(o||{})[LANG]||(o||{}).es||"";
const fmt=iso=>new Date(iso+"T12:00:00Z").toLocaleDateString(T().locale,{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
const ORDER=["producto","mercado","eventos","corporativo","salesforce"];
let cat="all";

function items(){
  if(!DATA) return [];
  const news=(DATA.noticias||[]).map(n=>Object.assign({kind:"news"},n));
  const sf=((DATA.salesforce||{}).items||[]).map(n=>Object.assign({kind:"sf",cat:"salesforce"},n));
  return news.concat(sf).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}
function pic(it,k){
  if(it.image) return `<div class="pic" style="background-image:url('${esc(it.image)}')" role="img" aria-label="${esc(tr(it.title))}"></div>`;
  return `<div class="pic" aria-hidden="true"><svg class="mesh" style="opacity:.35"><defs><pattern id="p${k}" width="48" height="83" patternUnits="userSpaceOnUse"><path d="M24 0L48 13.9V41.6L24 55.4L0 41.6V13.9Z M24 55.4V83" fill="none" stroke="#8caaff" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#p${k})"/></svg><span>${esc(T().cats[it.cat]||"")}</span></div>`;
}
function renderFilters(){
  const all=items(), counts={}; all.forEach(i=>counts[i.cat]=(counts[i.cat]||0)+1);
  const cats=ORDER.filter(c=>counts[c]);
  const el=document.getElementById("filters");
  el.innerHTML=[["all",all.length]].concat(cats.map(c=>[c,counts[c]])).map(([c,n])=>`<button type="button" data-c="${c}" aria-pressed="${c===cat}">${c==="all"?T().all:T().cats[c]}<span>${n}</span></button>`).join("");
  el.querySelectorAll("button").forEach(b=>b.onclick=()=>{cat=b.dataset.c; renderFilters(); renderFeed();});
}
function renderFeed(){
  const el=document.getElementById("feed"), list=items().filter(i=>cat==="all"||i.cat===cat);
  if(!list.length){ el.innerHTML=`<div class="empty">${T().noData}</div>`; return; }
  el.innerHTML=list.map((it,k)=>`<article class="news">
      <span class="node hex" aria-hidden="true"></span>${pic(it,k)}
      <div class="txt">
        <div class="meta">${it.kind==="sf"?`<span class="pill ${esc(it.status)}">${esc(T().st[it.status]||it.status)}</span>`:`<span class="cat">${esc(T().cats[it.cat]||it.cat)}</span>`}<span>${fmt(it.date)} · ${esc(it.source||"")}</span></div>
        <h2>${esc(tr(it.title))}</h2>
        <p>${it.kind==="sf"?esc(tr(it.text)):`<b>${T().why} · </b>${esc(tr(it.why))}`}</p>
        ${it.url?`<a class="go" href="${esc(it.url)}" target="_blank" rel="noopener">${T().read(esc(it.source||"la fuente"))}</a>`:""}
      </div></article>`).join("");
}
function renderSide(){
  const sf=(DATA&&DATA.salesforce)||{}, el=document.getElementById("side");
  if(!DATA||(!(sf.hitos||[]).length&&!(sf.items||[]).length)){ el.hidden=true; return; }
  el.hidden=false;
  el.innerHTML=`<div><p class="over">${T().track}</p><h2>${T().sfTitle}</h2>${sf.fase?`<p class="phase">${esc(tr(sf.fase))}</p>`:""}</div>
    <div class="miles">${(sf.hitos||[]).map(h=>`<div class="mile ${esc(h.state||"todo")}"><i class="hex" aria-hidden="true"></i><b>${esc(tr(h.title))}</b><span>${esc(tr(h.note))}</span></div>`).join("")}</div>
    <div>${(sf.items||[]).slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(it=>`<div class="sfi"><div class="meta"><span class="pill ${esc(it.status)}">${esc(T().st[it.status]||it.status)}</span><span>${fmt(it.date)}</span></div>${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(tr(it.title))} ↗</a>`:`<b>${esc(tr(it.title))}</b>`}<p>${esc(tr(it.text))}</p></div>`).join("")}</div>`;
}
function renderAll(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T()[el.dataset.t]);
  document.querySelectorAll("[data-t-aria]").forEach(el=>el.setAttribute("aria-label",T()[el.dataset.tAria]));
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  document.getElementById("src").textContent=DATA&&DATA.updated?T().src(fmt(DATA.updated)):"";
  renderFilters(); renderFeed(); renderSide();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem("blt-lang",LANG);}catch(e){}renderAll();});
renderAll();
if(!DATA) fetch("../data/actualidad.json").then(r=>r.json()).then(j=>{DATA=j;renderAll();}).catch(()=>{});
</script>
</body>
</html>
