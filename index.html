<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>COE Braze Iberia · JAKALA</title>
<link rel="icon" type="image/png" href="assets/jakala-j-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Home "Narrativa" (A4): blanco con malla hexagonal, tipografía grande con contorno, secciones 01-02-03.
   Rojo solo sobre blanco; Chroco siempre sobre fondo claro. */
:root{
  --jblue:#040066; --jblue-2:#040ab2; --jblue-3:#1941fa; --jblue-4:#3c82ff; --sky:#8caaff;
  --ink:#0d0b33; --black:#000; --red:#f00a0a; --muted:#4a4a63; --muted-2:#6b6b80;
  --line:#e3e6ef; --tint:#eef1fb; --white:#fff;
  --font:"Raleway",-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--white);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--jblue-3);text-decoration:none}
a:hover{color:var(--jblue)}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1320px;margin:0 auto;padding:0 48px}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.mesh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
:focus-visible{outline:2px solid var(--jblue-3);outline-offset:3px}

/* Cabecera */
.top{background:var(--white)}
.top .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px}
.brand img{height:22px;display:block}
.brand i{width:1px;height:22px;background:#cfcfcf}
.brand span{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--black)}
.nav{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:700;flex-wrap:wrap}
.nav a{color:var(--black)}
.nav a:hover{color:var(--jblue-3)}
.langs{display:flex;gap:4px;padding-left:22px;border-left:1px solid #e3e3e8}
.langs button{background:none;border:0;font:700 12px var(--font);letter-spacing:.08em;color:#8a8a99;padding:6px 6px;cursor:pointer;border-bottom:2px solid transparent}
.langs button[aria-pressed="true"]{color:var(--black);border-bottom-color:var(--red)}

/* Portada */
.hero{position:relative;overflow:hidden;border-bottom:1px solid #e8e8ee}
.hero .wrap{position:relative;padding-top:72px;padding-bottom:88px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:40px;align-items:center}
.eyebrow{margin:0;display:flex;align-items:center;gap:12px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--black)}
.eyebrow b{width:14px;height:16px;background:var(--red)}
.hero h1{font-size:clamp(56px,8vw,104px);line-height:.95;letter-spacing:-.035em;color:var(--jblue);font-weight:900;margin-top:30px}
.hero h1 .thin{font-weight:300}
.hero h1 .stroke{color:transparent;-webkit-text-stroke:2px var(--jblue)}
.hero .lead{margin:30px 0 0;font-size:18px;color:#3d3d5c;max-width:46ch}
.stage{justify-self:center;position:relative;width:460px;max-width:100%;aspect-ratio:1/1.1547;display:flex;align-items:center;justify-content:center}
.stage svg{position:absolute;inset:0;width:100%;height:100%}

/* Chroco */
@keyframes chFloat{0%,100%{translate:0 0}50%{translate:0 -10px}}
@keyframes chWave{from{rotate:-2deg}to{rotate:3deg}}
@keyframes emBob{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes emGlow{0%,100%{opacity:.35}50%{opacity:.9}}
.chroco{position:relative;width:300px;height:330px;margin-top:-20px;animation:chFloat 5s ease-in-out infinite;cursor:pointer}
.chroco img{position:absolute;bottom:0;left:50%}
.ch-normal{height:250px;transform:translateX(-50%) scaleX(-1)}
.ch-smile{height:262px;transform:translateX(-50%) scaleX(-1)}
.ch-wave{height:264px;transform:translateX(-50%);transform-origin:50% 100%;opacity:0;transition:opacity .15s}
.ch-face,.emote,.brow{opacity:0;transition:opacity .3s}
.chroco[data-mood="normal"] .ch-normal,
.chroco[data-mood="doubt"] .ch-normal,.chroco[data-mood="doubt"] .em-doubt,.chroco[data-mood="doubt"] .brow,
.chroco[data-mood="idea"] .ch-smile,.chroco[data-mood="idea"] .em-idea,
.chroco[data-mood="happy"] .ch-smile,.chroco[data-mood="happy"] .em-happy{opacity:1}
.chroco:hover .ch-face,.chroco:hover .emote,.chroco:hover .brow{opacity:0!important}
.chroco:hover .ch-wave{opacity:1;animation:chWave .45s ease-in-out infinite alternate}
.brow{position:absolute;width:15px;height:4.5px;border-radius:3px;background:#5a0000}
.brow-a{left:111px;top:99px;rotate:-30deg}
.brow-b{left:137px;top:106px;rotate:20deg}
.emote{position:absolute;pointer-events:none}
.em-doubt{top:4px;left:150px;display:flex;align-items:flex-end;gap:4px;font-weight:800;color:var(--jblue);line-height:1}
.em-doubt span:first-child{font-size:52px;rotate:-12deg;animation:emBob 1.6s ease-in-out infinite}
.em-doubt span:last-child{font-size:36px;rotate:10deg;animation:emBob 1.6s ease-in-out -.8s infinite}
.em-idea{top:-8px;left:138px}
.em-idea .rays{animation:emGlow 1.2s ease-in-out infinite}
.em-happy{top:10px;left:120px;width:130px;height:80px}
.em-happy span{position:absolute;animation:emBob 1.6s ease-in-out infinite}
.em-happy span:nth-child(2){animation-delay:-.8s}

/* Separador */
.band{position:relative;height:56px;background:var(--jblue);overflow:hidden}

/* Secciones */
.sec{position:relative}
.sec .wrap{position:relative;padding-top:104px;padding-bottom:104px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:56px}
.intro{display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.num{font-size:140px;line-height:.8;font-weight:900;color:transparent;-webkit-text-stroke:2px var(--jblue-3)}
.intro h2{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.02em;color:var(--jblue)}
.intro p{margin:0;font-size:16px;color:var(--muted);max-width:36ch}
.cta{display:inline-flex;align-items:center;gap:10px;height:50px;padding:0 24px;background:var(--jblue);color:var(--white);font-size:15px;font-weight:800}
.cta:hover{background:var(--jblue-3);color:var(--white)}
.soon{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid #c9cdd8;color:var(--muted-2);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.content{grid-column:span 2;min-width:0}
@media (max-width:900px){.content{grid-column:auto}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:18px}
.scard{display:flex;flex-direction:column;gap:14px;padding:24px;border:1px solid var(--line);background:var(--white);color:var(--ink);transition:transform .2s,box-shadow .2s,border-color .2s}
.scard:hover{transform:translateY(-4px);box-shadow:0 22px 44px -24px rgba(4,0,102,.35);border-color:var(--jblue-3);color:var(--ink)}
.scard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scard .d{display:flex;align-items:baseline;gap:8px}
.scard .d b{font-size:44px;font-weight:900;line-height:1;color:var(--jblue)}
.scard .d span{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted-2);text-transform:uppercase}
.scard .t{font-size:15px;font-weight:800;color:var(--jblue-3)}
.scard .title{font-size:17px;font-weight:700;line-height:1.3}
.scard .meta{margin-top:auto;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted-2)}
.empty{padding:32px;border:1px dashed #c9cdd8;color:var(--muted-2)}

.alt{background:var(--tint);overflow:hidden}
.timeline{position:relative;padding-left:40px}
.timeline::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:#c3cdf2}
.tl{position:relative;display:grid;background:var(--white);border:1px solid #dbe1f2;padding:22px 24px;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center}
.tl+.tl{margin-top:16px}
.tl::before{content:"";position:absolute;left:-38px;top:50%;translate:0 -50%;width:20px;height:23px;background:#c3cdf2;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.sk{display:block;height:12px;background:#e6eaf6;border-radius:2px}
a.tl{color:var(--ink);transition:transform .2s,box-shadow .2s,border-color .2s}
a.tl:hover{transform:translateX(4px);box-shadow:0 18px 36px -24px rgba(4,0,102,.35);border-color:var(--jblue-3);color:var(--ink)}
.tl.live::before{background:var(--jblue-3)}
.tl .sec{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2)}
.tl .ttl{font-size:17px;font-weight:800;line-height:1.3}
.tl .sum{font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{justify-self:end;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;white-space:nowrap}
.pill.ga{background:var(--jblue);color:#fff}.pill.beta{background:var(--jblue-3);color:#fff}
.pill.early{background:#fff;color:var(--jblue-3);box-shadow:inset 0 0 0 1px var(--jblue-3)}.pill.none{background:#f2f3f8;color:var(--muted-2)}
.tl-note{margin:20px 0 0;font-size:14px;color:var(--muted-2)}

/* Observatorio */
.obs{position:relative;overflow:hidden;background:#000;color:#fff;min-height:620px}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.slide.on{opacity:1}
.slide .img{position:absolute;inset:0;background:var(--jblue);background-size:cover;background-position:center}
.slide.on .img{animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1)}}
.slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.6) 45%,rgba(0,0,0,0) 78%)}
.obs .wrap{position:relative;padding-top:104px;padding-bottom:104px;display:flex;flex-direction:column;gap:24px;min-height:620px}
.obs .num{-webkit-text-stroke-color:var(--sky)}
.obs .over{margin:0;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sky)}
.story{display:flex;flex-direction:column;gap:18px;max-width:620px}
.story .tags{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.story .st{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:#fff;color:#000;padding:4px 9px}
.story .src{font-size:13px;font-weight:600;color:#c4c4d4}
.story h3{font-size:44px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.story p{margin:0;font-size:17px;color:#d0d0dc}
.obs-nav{margin-top:auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.obs-nav button{border:0;background:transparent;padding:8px 0;cursor:pointer;font:800 13px var(--font);letter-spacing:.1em;color:#6b6b80;border-bottom:2px solid #6b6b80}
.obs-nav button[aria-current="true"]{color:#fff;border-bottom-color:#fff}

footer{background:#000;border-top:4px solid var(--red);color:#b5b5c0;font-size:13px}
footer .wrap{padding-top:32px;padding-bottom:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer img{height:18px;display:block}

@media (max-width:640px){
  .wrap{padding:0 20px}
  .nav{gap:16px;font-size:13px}
  .langs{padding-left:12px}
  .num{font-size:96px}
  .intro h2{font-size:34px}
  .story h3{font-size:30px}
  .tl{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  chroco:"Chroco, la mascotte du groupe",
  s1t:"Sessions de formation", s1d:"Le calendrier en direct de Braze Learning, à l'heure de Madrid et classé par domaine.", s1cta:"Voir toutes les sessions",
  s2t:"Releases Braze", s2d:"Chaque nouveauté expliquée : ce que c'est, les cas d'usage possibles et si nous l'avons en GA.", soon:"Bientôt",
  s2note:"Cette section sera reliée aux release notes officielles de Braze.",
  s3over:"Observatoire Braze + Salesforce", st:{anunciado:"Annoncé",rumoreado:"Rumeur",disponible:"Disponible"}, readMore:"Lire la source →",
  noSessions:"Aucune session à venir en horaire Espagne.", footer:"COE Braze Iberia · Usage interne",
  dow:["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"],
  areas:{orq:"Orchestration",can:"Canaux",dat:"Données et intégrations",ia:"IA et personnalisation",uc:"Cas d'usage",cert:"Certification",otr:"Autres"} },
 it:{ s2cta:"Vedi tutte le release", s2live:"Novità della release del {d}. Fonte: release notes ufficiali di Braze.", lab:{"ga":"GA","beta":"Beta","early":"Early access","none":"Senza etichetta"}, locale:"it-IT", nav1:"01 Formazione", nav2:"02 Prodotto", nav3:"03 Osservatorio", eyebrow:"Hub interno del gruppo di referenti",
  h1:'Braze,<br><span class="thin">raccontato da</span><br><span class="stroke">chi lo</span><br>usa.',
  lead:"Formazione, novità di prodotto e ciò che succede intorno a Braze, da e per il team Jakala.",
  chroco:"Chroco, la mascotte del gruppo",
  s1t:"Sessioni di formazione", s1d:"Il calendario dal vivo di Braze Learning, in orario di Madrid e ordinato per area.", s1cta:"Vedi tutte le sessioni",
  s2t:"Release di Braze", s2d:"Ogni novità spiegata: cos'è, quali casi d'uso abilita e se l'abbiamo in GA.", soon:"Prossimamente",
  s2note:"Questa sezione sarà collegata alle release notes ufficiali di Braze.",
  s3over:"Osservatorio Braze + Salesforce", st:{anunciado:"Annunciato",rumoreado:"Indiscrezione",disponible:"Disponibile"}, readMore:"Leggi la fonte →",
  noSessions:"Nessuna sessione in arrivo in orario Spagna.", footer:"COE Braze Iberia · Uso interno",
  dow:["Dom","Lun","Mar","Mer","Gio","Ven","Sab"],
  areas:{orq:"Orchestrazione",can:"Canali",dat:"Dati e integrazioni",ia:"IA e personalizzazione",uc:"Casi d'uso",cert:"Certificazione",otr:"Altro"} }
};
let LANG = "es";
try { const s = localStorage.getItem("blt-lang"); if (I18N[s]) LANG = s; else { const n = (navigator.language||"").slice(0,2); if (I18N[n]) LANG = n; } } catch(e) {}
const T = () => I18N[LANG];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function areaOf(t){
  if(/bootcamp/i.test(t)) return "cert";
  if(/liquid|\bai\b|prompt|agentic|decisioning|personali/i.test(t)) return "ia";
  if(/connected content|technical|integration|data/i.test(t)) return "dat";
  if(/email|sms|whatsapp|push|in-app|content card/i.test(t)) return "can";
  if(/canvas|orchestration|foundations/i.test(t)) return "orq";
  if(/transaction|reengag|winback|churn/i.test(t)) return "uc";
  return "otr";
}
function typeOf(t,u){
  if(/bootcamp/i.test(t)) return "Bootcamp";
  if(/webinar/i.test(t+u)) return "Webinar";
  if(/workshop/i.test(t)) return "Workshop";
  if(/get started/i.test(t)) return "Get Started";
  return "Live training";
}

/* Próximas sesiones en horario ES (lunes a viernes, inicio 8:30–20:00, en inglés) */
function upcoming(){
  if(!INLINE || !INLINE.events) return [];
  const now = Date.now();
  return INLINE.events.map(e => {
    const s=e.start, y=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10), hh=s.slice(11,16);
    const dow=new Date(Date.UTC(y,m-1,d)).getUTCDay(), mins=+hh.slice(0,2)*60 + +hh.slice(3,5);
    const ja=(e.tags||[]).includes("ja") || /[぀-ヿ一-鿿]/.test(e.title);
    return { title:e.title, url:"https://learning.braze.com"+(e.url||""), ts:Date.parse(s), d, dow, hh, ok: !ja && dow>=1 && dow<=5 && mins>=510 && mins<=1200 };
  }).filter(e => e.ok && e.ts >= now - 3600e3).sort((a,b) => a.ts-b.ts).slice(0,6);
}

function renderSessions(){
  const list = upcoming(), el = document.getElementById("sessions");
  el.innerHTML = list.length ? list.map(s => `
    <a class="scard" href="${esc(s.url)}" target="_blank" rel="noopener">
      <span class="row"><span class="d"><b>${s.d}</b><span>${T().dow[s.dow]}</span></span><span class="t">${s.hh}</span></span>
      <span class="title">${esc(s.title.replace(/^Get Started with Braze: /,"Get Started: "))}</span>
      <span class="meta">${T().areas[areaOf(s.title)]} · ${typeOf(s.title,s.url)}</span>
    </a>`).join("") : `<div class="empty">${T().noSessions}</div>`;
}

/* Releases: novedades de la última release (sin SDK) */
function renderReleases(){
  const box=document.getElementById("relList"), note=document.getElementById("relNote");
  const r=RELEASES && RELEASES.releases && RELEASES.releases[0];
  if(!r){ box.innerHTML=[0,1,2].map(()=>`<div class="tl" aria-hidden="true"><span style="display:flex;flex-direction:column;gap:10px"><span class="sk" style="width:60%;height:14px"></span><span class="sk" style="width:40%"></span></span><span class="sk" style="width:46px;height:20px"></span></div>`).join(""); note.textContent=T().s2note; return; }
  const its=r.items.filter(i=>!/^sdk/i.test(i.section)).slice(0,5);
  box.innerHTML=its.map(i=>`<a class="tl live" href="releases/#${r.date}"><span style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="sec">${esc(i.section)}</span><span class="ttl">${esc(i.title)}</span><span class="sum">${esc(i.summary||"")}</span></span><span class="pill ${i.label||"none"}">${T().lab[i.label||"none"]}</span></a>`).join("");
  const d=new Date(r.date+"T12:00:00Z").toLocaleDateString(T().locale,{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
  note.textContent=T().s2live.replace("{d}",d);
}

/* Observatorio */
let obsItems = (OBS && OBS.items) || [], obsI = 0, obsTimer = null;
function fmtDate(iso){ return new Date(iso+"T12:00:00Z").toLocaleDateString(T().locale,{day:"numeric",month:"long",year:"numeric",timeZone:"UTC"}); }
function renderObs(){
  const sl = document.getElementById("slides"), st = document.getElementById("story"), dots = document.getElementById("dots");
  if(!obsItems.length){ document.getElementById("observatorio").hidden = true; return; }
  sl.innerHTML = obsItems.map((it,k) => `<div class="slide${k===obsI?" on":""}"><div class="img"${it.image?` style="background-image:url('${esc(it.image)}')"`:""}>${it.image?"":`<svg class="mesh" style="opacity:.3"><defs><pattern id="ob${k}" width="56" height="97" patternUnits="userSpaceOnUse"><path d="M28 0L56 16.2V48.5L28 64.7L0 48.5V16.2Z M28 64.7V97" fill="none" stroke="#8caaff" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#ob${k})"/></svg>`}</div><div class="shade"></div></div>`).join("");
  const it = obsItems[obsI];
  st.innerHTML = `<div class="tags"><span class="st">${T().st[it.status]||it.status}</span><span class="src">${fmtDate(it.date)} · ${esc(it.source||"")}</span></div>
    <h3>${esc((it.title||{})[LANG]||(it.title||{}).es||"")}</h3><p>${esc((it.text||{})[LANG]||(it.text||{}).es||"")}</p>
    ${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener" style="font-size:14px;font-weight:800;color:#8caaff">${T().readMore}</a>`:""}`;
  dots.innerHTML = obsItems.length>1 ? obsItems.map((_,k)=>`<button type="button" data-k="${k}" aria-current="${k===obsI}">0${k+1}</button>`).join("") : "";
  dots.querySelectorAll("button").forEach(b => b.onclick = () => { obsI=+b.dataset.k; renderObs(); startObs(); });
}
function startObs(){ clearInterval(obsTimer); if(obsItems.length>1) obsTimer=setInterval(()=>{ obsI=(obsI+1)%obsItems.length; renderObs(); },7000); }

/* Chroco: normal → dudando → normal → idea → contento */
(function mood(){
  const el = document.getElementById("chroco");
  const seq = [["normal",2600],["doubt",3200],["normal",1800],["idea",3000],["happy",2200]];
  let k = 0;
  (function tick(){ el.dataset.mood = seq[k][0]; setTimeout(()=>{ k=(k+1)%seq.length; tick(); }, seq[k][1]); })();
})();

function renderAll(){
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T()[el.dataset.t]);
  document.querySelectorAll("[data-h]").forEach(el => el.innerHTML = T()[el.dataset.h]);
  document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", T()[el.dataset.tAria]));
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===LANG));
  renderSessions(); renderReleases(); renderObs();
}
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => { LANG=b.dataset.lang; try{localStorage.setItem("blt-lang",LANG);}catch(e){} renderAll(); });

renderAll(); startObs();
/* Vista previa local: si la página no lleva los datos insertados, los lee de data/ */
if(!RELEASES) fetch("data/releases.json").then(r=>r.json()).then(j=>{ RELEASES=j; renderReleases(); }).catch(()=>{});
if(!INLINE) fetch("data/sessions.json").then(r=>r.json()).then(j=>{ INLINE=j; renderSessions(); }).catch(()=>{});
if(!OBS) fetch("data/observatorio.json").then(r=>r.json()).then(j=>{ OBS=j; obsItems=j.items||[]; renderObs(); startObs(); }).catch(()=>{});
</script>
