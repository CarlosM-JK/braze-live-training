<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Releases de Braze · COE Braze Iberia</title>
<link rel="icon" type="image/png" href="../assets/jakala-j-blue.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Releases (diseño R2 · Cronología): índice por meses + lanzamientos plegables con pestañas por sección.
   Datos de data/releases.json (robot diario) y valoraciones de data/releases_notas.json. */
:root{
  --jblue:#040066; --jblue-2:#040ab2; --jblue-3:#1941fa; --jblue-4:#3c82ff; --sky:#8caaff; --rail:#c3cdf2;
  --ink:#0d0b33; --black:#000; --red:#f00a0a; --muted:#4a4a63; --muted-2:#6b6b80;
  --line:#e3e6ef; --tint:#eef1fb; --soft:#f6f7fb; --white:#fff;
  --font:"Raleway",-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--white);color:var(--ink);font:400 16px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:var(--jblue-3);text-decoration:none}
a:hover{color:var(--jblue)}
h1,h2,h3{margin:0;text-wrap:balance}
button{font-family:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:0 48px}
.mesh{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
:focus-visible{outline:2px solid var(--jblue-3);outline-offset:3px}

.top{background:var(--white);border-bottom:1px solid #e8e8ee}
.top .wrap{height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:18px;color:inherit}
.brand img{height:22px;display:block}
.brand i{width:1px;height:22px;background:#cfcfcf}
.brand span{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--black)}
.nav{display:flex;align-items:center;gap:30px;font-size:14px;font-weight:700;flex-wrap:wrap}
.nav a{color:var(--black)}
.nav a[aria-current="page"]{color:var(--jblue-3)}
.langs{display:flex;gap:4px;padding-left:22px;border-left:1px solid #e3e3e8}
.langs button{background:none;border:0;font:700 12px var(--font);letter-spacing:.08em;color:#8a8a99;padding:6px;cursor:pointer;border-bottom:2px solid transparent}
.langs button[aria-pressed="true"]{color:var(--black);border-bottom-color:var(--red)}

.head{position:relative;overflow:hidden;background:var(--tint)}
.head .wrap{position:relative;padding-top:56px;padding-bottom:48px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px}
.num{font-size:110px;line-height:.8;font-weight:900;color:transparent;-webkit-text-stroke:2px var(--jblue-3)}
.head h1{font-size:clamp(40px,5vw,56px);line-height:1.02;font-weight:800;letter-spacing:-.02em;color:var(--jblue);margin-top:18px}
.head p{margin:12px 0 0;font-size:17px;color:var(--muted);max-width:56ch}
.stats{display:flex;gap:36px;flex-wrap:wrap}
.stat b{display:block;font-size:40px;font-weight:900;line-height:1;color:var(--jblue)}
.stat span{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--muted-2)}

.body{padding-top:40px;padding-bottom:96px;display:flex;flex-wrap:wrap;gap:40px;align-items:flex-start}
.index{flex:1 1 200px;max-width:220px;position:sticky;top:24px;display:flex;flex-direction:column;gap:2px}
.index .yr{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--muted-2);padding:14px 12px 8px}
.index .yr:first-child{padding-top:0}
.index a{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.index a span:first-child{text-transform:capitalize}
.index a span:last-child{opacity:.6}
.index a:hover{background:var(--soft);color:var(--ink)}
.index a[aria-current="true"]{background:var(--jblue);color:var(--white)}
.tlw{flex:999 1 640px;min-width:0;position:relative;padding-left:42px}
.tlw::before{content:"";position:absolute;left:10px;top:20px;bottom:20px;width:2px;background:var(--rail)}
.rel{position:relative;scroll-margin-top:24px}
.rel+.rel{margin-top:14px}
.rel .node{position:absolute;left:-41px;top:30px;width:20px;height:23px;background:var(--rail)}
.rel.open .node{background:var(--jblue-3)}
.rel .card{background:var(--white);border:1px solid var(--line)}
.rel.open .card{border-color:var(--jblue-3)}
.rel-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 26px;background:none;border:0;cursor:pointer;text-align:left;color:var(--ink)}
.rel-btn .when{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.rel-btn .when b{font-size:28px;font-weight:900;color:var(--jblue);text-transform:capitalize}
.rel-btn .when span{font-size:14px;font-weight:700;color:var(--muted-2)}
.rel-btn .new{font-size:10.5px;font-weight:800;letter-spacing:.12em;color:var(--red)}
.rel-btn svg{flex:none;transition:transform .2s}
.rel.open .rel-btn svg{transform:rotate(180deg)}
.panel{border-top:1px solid var(--line);padding:0 26px 26px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;font-size:14px;font-weight:800;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted-2);white-space:nowrap;cursor:pointer}
.tab span{opacity:.6;margin-left:4px}
.tab[aria-selected="true"]{color:var(--jblue);border-bottom-color:var(--jblue-3)}
.grid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px}
.item{border:1px solid var(--line);padding:20px 22px;display:flex;flex-direction:column;gap:10px;background:var(--white)}
.item .t{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.item h3{font-size:16px;line-height:1.3;font-weight:800}
.item p{margin:0;font-size:14px;line-height:1.5;color:var(--muted)}
.item .links{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:800}
.pill{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;white-space:nowrap}
.pill.ga{background:var(--jblue);color:var(--white)}
.pill.beta{background:var(--jblue-3);color:var(--white)}
.pill.early{background:var(--white);color:var(--jblue-3);box-shadow:inset 0 0 0 1px var(--jblue-3)}
.pill.none{background:var(--soft);color:var(--muted-2)}
.eval{margin:4px 0 0;padding:12px 14px;background:var(--soft);font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.eval dt{font-weight:800;color:var(--black)}
.eval dd{margin:0;color:var(--muted)}
.pending{margin-top:auto;font-size:12px;font-weight:700;color:#9a9ab0}
.foot{margin:16px 0 0;font-size:13px;font-weight:700;color:var(--muted-2)}
.empty{padding:40px;border:1px dashed #c9cdd8;color:var(--muted-2);text-align:center}

footer{background:#000;border-top:4px solid var(--red);color:#b5b5c0;font-size:13px}
footer .wrap{padding-top:32px;padding-bottom:32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer img{height:18px;display:block}

@media (max-width:900px){.index{position:static;max-width:none;flex-direction:row;flex-wrap:wrap}.index .yr{width:100%}}
@media (max-width:640px){.wrap{padding:0 20px}.nav{gap:14px;font-size:13px}.langs{padding-left:10px}.num{font-size:80px}.tlw{padding-left:30px}.tlw::before{left:6px}.rel .node{left:-31px}.rel-btn{padding:18px}.panel{padding:0 18px 18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="../"><img src="../assets/jakala-logo-full.png" alt="JAKALA"><i></i><span>COE Braze Iberia</span></a>
    <nav class="nav" aria-label="Secciones">
      <a href="../sesiones/" data-t="nav1"></a>
      <a href="./" aria-current="page" data-t="nav2"></a>
      <a href="../actualidad/" data-t="nav3"></a>
      <span class="langs" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button><button type="button" data-lang="it">IT</button>
      </span>
    </nav>
  </div>
</header>

<section class="head">
  <svg class="mesh" aria-hidden="true" style="opacity:.7"><defs><pattern id="hx" width="48" height="83" patternUnits="userSpaceOnUse"><path d="M24 0L48 13.9V41.6L24 55.4L0 41.6V13.9Z M24 55.4V83" fill="none" stroke="#dbe2f8" stroke-width="1"/></pattern></defs><rect width="100%" height="100%" fill="url(#hx)"/></svg>
  <div class="wrap">
    <div>
      <span class="num" aria-hidden="true">02</span>
      <h1 data-t="title"></h1>
      <p data-t="lead"></p>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<div class="wrap body">
  <nav class="index" id="index" data-t-aria="indexLabel"></nav>
  <div class="tlw" id="timeline"></div>
</div>

<footer>
  <div class="wrap">
    <img src="../assets/jakala-logo-white.png" alt="JAKALA">
    <span id="src"></span>
  </div>
</footer>

<script>
let DATA = /*__RELEASES__*/null;
let NOTES = /*__RELNOTES__*/null;

const I18N = {
 es:{ locale:"es-ES", nav1:"01 Formación", nav2:"02 Producto", nav3:"03 Actualidad", indexLabel:"Índice de lanzamientos",
  title:"Releases de Braze", lead:"Lanzamientos de producto publicados por Braze desde 2026. Despliega cada uno para ver sus novedades.",
  stR:"lanzamientos", stI:"funcionalidades", news:n=>`${n} novedades`, inGA:n=>`${n} en GA`, latest:"ÚLTIMO",
  labels:{ga:"GA",beta:"Beta",early:"Early access",none:"Sin etiqueta"},
  viewBraze:"Ver en Braze Docs ↗", doc:"Documentación ↗", inSection:(s,n)=>`${s}: ${n} ${n===1?"novedad":"novedades"}`,
  pending:"Pendiente de valorar por el grupo", evUse:"Casos de uso", evInst:"¿La tenemos?", evAsk:"¿Pedirla?", evOwner:"Responsable", evNote:"Comentario",
  yes:"Sí", no:"No", unknown:"Por confirmar", noData:"Todavía no hay datos de releases. Se cargarán en la próxima actualización automática.",
  src:d=>`Fuente: release notes oficiales de Braze · Actualizado el ${d}` },
 en:{ locale:"en-GB", nav1:"01 Training", nav2:"02 Product", nav3:"03 News", indexLabel:"Release index",
  title:"Braze releases", lead:"Product releases published by Braze since 2026. Expand each one to see what's new.",
  stR:"releases", stI:"features", news:n=>`${n} updates`, inGA:n=>`${n} in GA`, latest:"LATEST",
  labels:{ga:"GA",beta:"Beta",early:"Early access",none:"No label"},
  viewBraze:"View on Braze Docs ↗", doc:"Documentation ↗", inSection:(s,n)=>`${s}: ${n} ${n===1?"update":"updates"}`,
  pending:"Pending group assessment", evUse:"Use cases", evInst:"Do we have it?", evAsk:"Request it?", evOwner:"Owner", evNote:"Comment",
  yes:"Yes", no:"No", unknown:"To be confirmed", noData:"No release data yet. It will load on the next automatic update.",
  src:d=>`Source: official Braze release notes · Updated on ${d}` },
 fr:{ locale:"fr-FR", nav1:"01 Formation", nav2:"02 Produit", nav3:"03 Actualités", indexLabel:"Index des releases",
  title:"Releases Braze", lead:"Les lancements produit publiés par Braze depuis 2026. Dépliez-en un pour voir ses nouveautés.",
  stR:"lancements", stI:"fonctionnalités", news:n=>`${n} nouveautés`, inGA:n=>`${n} en GA`, latest:"DERNIER",
  labels:{ga:"GA",beta:"Bêta",early:"Early access",none:"Sans étiquette"},
  viewBraze:"Voir sur Braze Docs ↗", doc:"Documentation ↗", inSection:(s,n)=>`${s} : ${n} nouveauté${n===1?"":"s"}`,
  pending:"Évaluation du groupe en attente", evUse:"Cas d'usage", evInst:"L'avons-nous ?", evAsk:"La demander ?", evOwner:"Responsable", evNote:"Commentaire",
  yes:"Oui", no:"Non", unknown:"À confirmer", noData:"Pas encore de données. Elles arriveront à la prochaine mise à jour automatique.",
  src:d=>`Source : release notes officielles de Braze · Mis à jour le ${d}` },
 it:{ locale:"it-IT", nav1:"01 Formazione", nav2:"02 Prodotto", nav3:"03 Attualità", indexLabel:"Indice delle release",
  title:"Release di Braze", lead:"Le release di prodotto pubblicate da Braze dal 2026. Espandine una per vedere le novità.",
  stR:"release", stI:"funzionalità", news:n=>`${n} novità`, inGA:n=>`${n} in GA`, latest:"ULTIMA",
  labels:{ga:"GA",beta:"Beta",early:"Early access",none:"Senza etichetta"},
  viewBraze:"Vedi su Braze Docs ↗", doc:"Documentazione ↗", inSection:(s,n)=>`${s}: ${n} novità`,
  pending:"In attesa di valutazione del gruppo", evUse:"Casi d'uso", evInst:"Ce l'abbiamo?", evAsk:"Richiederla?", evOwner:"Responsabile", evNote:"Commento",
  yes:"Sì", no:"No", unknown:"Da confermare", noData:"Ancora nessun dato. Arriverà con il prossimo aggiornamento automatico.",
  src:d=>`Fonte: release notes ufficiali di Braze · Aggiornato il ${d}` }
};
let LANG="es";
try { const s=localStorage.getItem("blt-lang"); if(I18N[s]) LANG=s; else { const n=(navigator.language||"").slice(0,2); if(I18N[n]) LANG=n; } } catch(e) {}
const T=()=>I18N[LANG];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=iso=>new Date((iso.length===10?iso+"T12:00:00Z":iso));
const fmt=(iso,opt)=>dt(iso).toLocaleDateString(T().locale,Object.assign({timeZone:"Europe/Madrid"},opt||{day:"numeric",month:"long",year:"numeric"}));
const monthName=iso=>dt(iso).toLocaleDateString(T().locale,{month:"long",timeZone:"UTC"});
const REL=()=>(DATA&&DATA.releases)||[];
const lab=it=>it.label||"none";
const CHEV='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#040066" stroke-width="2.2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';

const state={open:new Set(), tab:{}};

function sectionsOf(r){
  const m=new Map(); r.items.forEach(it=>m.set(it.section,(m.get(it.section)||0)+1));
  return [...m.entries()].sort((a,b)=>(/^sdk/i.test(a[0])-/^sdk/i.test(b[0]))||(b[1]-a[1]));
}
function evalBlock(r,it){
  const n=NOTES&&NOTES.items&&NOTES.items[r.date+"#"+it.id];
  if(!n) return `<span class="pending">${T().pending}</span>`;
  const yn=v=>v==="si"||v==="sí"||v===true?T().yes:v==="no"||v===false?T().no:T().unknown;
  const rows=[];
  if(n.casos_uso) rows.push([T().evUse,esc(n.casos_uso)]);
  if(n.en_instancia!=null) rows.push([T().evInst,yn(n.en_instancia)]);
  if(n.pedir!=null) rows.push([T().evAsk,yn(n.pedir)]);
  if(n.responsable) rows.push([T().evOwner,esc(n.responsable)]);
  if(n.comentario) rows.push([T().evNote,esc(n.comentario)]);
  return rows.length?`<dl class="eval">${rows.map(x=>`<dt>${x[0]}</dt><dd>${x[1]}</dd>`).join("")}</dl>`:`<span class="pending">${T().pending}</span>`;
}

function renderIndex(){
  const byYear=new Map(); REL().forEach(r=>{const y=r.date.slice(0,4); if(!byYear.has(y)) byYear.set(y,[]); byYear.get(y).push(r);});
  let h=""; for(const [y,rs] of byYear){ h+=`<span class="yr">${y}</span>`+rs.map(r=>`<a href="#${r.date}" data-d="${r.date}" aria-current="${state.open.has(r.date)}"><span>${monthName(r.date)} ${dt(r.date).getUTCDate()}</span><span>${r.items.length}</span></a>`).join(""); }
  const el=document.getElementById("index"); el.innerHTML=h;
  el.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault(); openRel(a.dataset.d,true);});
}

function panel(r){
  const secs=sectionsOf(r), cur=state.tab[r.date]||secs[0][0];
  const its=r.items.filter(i=>i.section===cur);
  return `<div class="panel">
    <div class="tabs" role="tablist">${secs.map(([s,n])=>`<button type="button" class="tab" role="tab" data-d="${r.date}" data-s="${esc(s)}" aria-selected="${s===cur}">${esc(s)}<span>${n}</span></button>`).join("")}</div>
    <div class="grid" role="tabpanel">${its.map(it=>`
      <article class="item" id="${esc(r.date+"-"+it.id)}">
        <div class="t"><h3>${esc(it.title)}</h3><span class="pill ${lab(it)}">${T().labels[lab(it)]}</span></div>
        ${it.summary?`<p>${esc(it.summary)}</p>`:""}
        <div class="links">${it.doc?`<a href="${esc(it.doc)}" target="_blank" rel="noopener">${T().doc}</a>`:""}<a href="${esc(r.url+"#"+it.id)}" target="_blank" rel="noopener">${T().viewBraze}</a></div>
        ${evalBlock(r,it)}
      </article>`).join("")}</div>
    <p class="foot">${T().inSection(esc(cur),its.length)} · <a href="${esc(r.url)}" target="_blank" rel="noopener">${T().viewBraze}</a></p>
  </div>`;
}

function renderTimeline(){
  const el=document.getElementById("timeline");
  if(!REL().length){ el.innerHTML=`<div class="empty">${T().noData}</div>`; return; }
  el.innerHTML=REL().map((r,i)=>{
    const open=state.open.has(r.date), ga=r.items.filter(x=>x.label==="ga").length;
    return `<div class="rel${open?" open":""}" id="${r.date}">
      <span class="node hex" aria-hidden="true"></span>
      <article class="card">
        <button type="button" class="rel-btn" data-d="${r.date}" aria-expanded="${open}">
          <span class="when"><b>${monthName(r.date)} ${dt(r.date).getUTCDate()}</b><span>${T().news(r.items.length)} · ${T().inGA(ga)}</span>${i===0?`<span class="new">${T().latest}</span>`:""}</span>${CHEV}
        </button>
        ${open?panel(r):""}
      </article></div>`;
  }).join("");
  el.querySelectorAll(".rel-btn").forEach(b=>b.onclick=()=>{const d=b.dataset.d; state.open.has(d)?state.open.delete(d):state.open.add(d); renderIndex(); renderTimeline();});
  el.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab[b.dataset.d]=b.dataset.s; renderTimeline();});
}

function openRel(d,scroll){
  state.open.add(d); renderIndex(); renderTimeline();
  try{ history.replaceState(null,"","#"+d); }catch(e){}
  if(scroll){ const el=document.getElementById(d); if(el) el.scrollIntoView({block:"start"}); }
}

function renderAll(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T()[el.dataset.t]);
  document.querySelectorAll("[data-t-aria]").forEach(el=>el.setAttribute("aria-label",T()[el.dataset.tAria]));
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));
  const rs=REL(), n=rs.reduce((a,r)=>a+r.items.length,0);
  document.getElementById("stats").innerHTML=rs.length?`<div class="stat"><b>${rs.length}</b><span>${T().stR}</span></div><div class="stat"><b>${n}</b><span>${T().stI}</span></div>`:"";
  document.getElementById("src").textContent=DATA&&DATA.updated?T().src(fmt(DATA.updated)):"";
  renderIndex(); renderTimeline();
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem("blt-lang",LANG);}catch(e){}renderAll();});

function init(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(/^\d{4}-\d{2}-\d{2}$/.test(h) && REL().some(r=>r.date===h)) state.open.add(h);
  else if(REL()[0]) state.open.add(REL()[0].date);
  renderAll();
  if(state.open.has(h)){ const el=document.getElementById(h); if(el) setTimeout(()=>el.scrollIntoView({block:"start"}),50); }
}
window.addEventListener("hashchange",()=>{const h=decodeURIComponent(location.hash.slice(1)); if(/^\d{4}-\d{2}-\d{2}$/.test(h)&&REL().some(r=>r.date===h)) openRel(h,true);});
init();
if(!DATA) fetch("../data/releases.json").then(r=>r.json()).then(j=>{DATA=j;init();}).catch(()=>{});
if(!NOTES) fetch("../data/releases_notas.json").then(r=>r.json()).then(j=>{NOTES=j;renderTimeline();}).catch(()=>{});
</script>
</body>
</html>
